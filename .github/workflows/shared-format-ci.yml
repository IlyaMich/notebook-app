name: Shared Format CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-format-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-format-validation:
    name: Portable format validation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: shared/validators/requirements.txt
      - name: Install validator dependencies
        run: python -m pip install -r shared/validators/requirements.txt
      - name: Validate schema and run positive/negative tests
        run: python -m unittest discover -s shared/validators/tests -v
